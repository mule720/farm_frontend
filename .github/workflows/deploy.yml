name: Deploy AgroNexus Frontend

# Was GKE-targeted (agronexus-cluster on the "agrinexus-farm" GCP project) -
# switched to the same Hostinger VPS the rest of the ecosystem now deploys
# onto, for the same reason as the backend.
on:
  push:
    branches: [master, main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/farm/farm_frontend
            git pull --ff-only
            docker build -t farm-frontend:latest .

            docker stop farm-frontend-web 2>/dev/null || true
            docker rm farm-frontend-web 2>/dev/null || true
            docker run -d --name farm-frontend-web --restart unless-stopped --network host \
              farm-frontend:latest

            docker image prune -f
